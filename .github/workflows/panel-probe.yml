name: Panel Probe (real desktop)

# Do the editor's panels come back after a restart, on a real desktop?
# Offscreen tests passed while users on Windows still lost their floating
# panels behind the main window; this runs the real start-up on a real
# windowing system and keeps the screenshots. Run it by hand ("Run workflow").

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make, float, reopen, open from the home screen, reopen
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "probe"
          $env:QT_QPA_PLATFORM = "offscreen"
          python scripts/probe_panels.py make $out
          Remove-Item Env:\QT_QPA_PLATFORM
          $failed = $false
          foreach ($phase in @("float", "reopen", "home", "reopen")) {
            $p = Start-Process python -ArgumentList "scripts/probe_panels.py", $phase, $out -PassThru -NoNewWindow `
                 -RedirectStandardOutput (Join-Path $out "$phase.out") -RedirectStandardError (Join-Path $out "$phase.err")
            if (-not $p.WaitForExit(180000)) {
              # The app did not quit when its window closed: a panel kept it running.
              Write-Output "::error::$phase did not exit after the main window closed"
              $p.Kill(); $failed = $true
            } else {
              Write-Output "$phase exit $($p.ExitCode)"
            }
          }
          Get-Content (Join-Path $out "probe.log")
          $log = Get-Content (Join-Path $out "probe.log") -Raw
          if ($log -match "ticked but not seen \['" -or $log -match "not owned by the main window \['") { $failed = $true }
          if ($failed) { exit 1 }

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe
